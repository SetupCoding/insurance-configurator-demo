# pnpm has read only auth and registry settings from .npmrc since v11, so every
# other setting lives here now.
#
# The Next.js standalone build traces runtime dependencies by walking
# node_modules, and the default symlinked layout leaves @swc/helpers out of the
# bundle, so this line is load-bearing for the container (ADR 0006).
#
# Deleting it does not fail loudly on its own. Measured on Next 16.3.3, the
# container still starts, reports healthy and answers every request CI makes of
# it while shipping a bundle that cannot resolve @swc/helpers, and pnpm ignores
# the old `node-linker=hoisted` spelling in .npmrc without warning. The resolve
# step in the container job is what catches it. Read the update in
# docs/adr/0006 before touching this.
nodeLinker: hoisted

# pnpm's own version switching is off, and there is no `packageManager` field
# in package.json for it to act on. Both halves of that matter.
#
# Fetching the declared version is what pnpm 12 cannot do reliably: it ships a
# launcher whose real binary is an optional per-platform dependency, and every
# consumer that tried to fetch 12 on its own left that binary unresolved.
# Vercel's install, Vercel's build, pnpm 10 on Windows and the Dependabot
# updater all failed that way, the last of them on a blocked request for
# @pnpm/exe.linux-x64. So each environment names the version itself instead:
# see the note in AGENTS.md for where.
#
# This setting stays even with nothing to switch on, so that re-adding a
# `packageManager` field cannot quietly bring back the second lockfile
# document that Dependabot refuses to parse (dependabot-core#14794).
pmOnFail: ignore

# Replaces ignoredBuiltDependencies, which v11 folded into this map, and names
# three packages that setting did not. None of these have run their build script
# here under any version: pnpm denies every dependency by default, and the app
# builds and the container passes its healthcheck without them. The list grew
# only because v11 promoted the warning about an undeclared one into an error
# (strictDepBuilds defaults to true), so the refusal has to be written down now
# rather than tolerated as install noise. `false` is that refusal, and it keeps
# the behaviour this project already had.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  msw: false
  sharp: false
  unrs-resolver: false

# minimumReleaseAge is deliberately left at its v11 default of 1440, so a
# release published less than a day ago is refused. Worth knowing where that
# surfaces: the policy is checked against the committed lockfile on every
# install, --frozen-lockfile included, so a Dependabot PR that locks a same-day
# release fails CI until the release ages past the cutoff. Rerunning the job a
# day later passes with no change to the branch.
