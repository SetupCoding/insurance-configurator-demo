name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA rather than a tag. A tag is mutable, so
# `@v4` can be repointed at different code without a line here changing. The
# trailing version comment is what Dependabot reads and rewrites on an update.
jobs:
  verify:
    name: Lint, types, unit & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run e2e and accessibility tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # The unit and e2e jobs both run against a dev/next-start server, so neither
  # exercises the standalone bundle the image actually ships. This job exists
  # because a deps stage built without the hoisted linker once passed every other
  # gate and still produced a container that died at start on an unresolvable
  # @swc/helpers.
  #
  # Starting and serving stopped being evidence of that: on Next 16.3.3 the same
  # incomplete bundle comes up healthy and answers every request below. The
  # resolve step is what actually proves the layout, and it is the only thing in
  # this job that fails on a bundle missing the dependency. See docs/adr/0006.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t insurance-configurator-demo:ci .
      - name: Start the container
        run: docker run -d --name web -p 3000:3000 insurance-configurator-demo:ci
      - name: Wait for the image's own healthcheck
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' web)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "container never became healthy"
          exit 1
      # Next's own app-router requires these two at the top level, so a bundle
      # without them crashes on whichever request first loads it. The healthcheck
      # above does not, and neither does anything else here, so the claim is
      # asserted rather than assumed. Deleting nodeLinker from
      # pnpm-workspace.yaml is what makes this step fail.
      - name: Resolve the dependency the standalone trace drops
        run: >-
          docker exec web node -e "require.resolve('@swc/helpers/_/_interop_require_default');
          require.resolve('@swc/helpers/_/_interop_require_wildcard')"
      - name: Accept a complete path
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/conversation \
            -H 'Content-Type: application/json' \
            -d '[{"name":"liability","value":false},{"name":"casco","value":false},{"name":"licensePlateType","value":"ekz"}]')
          test "$code" = "200"
      - name: Reject a path the flow does not allow
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/conversation \
            -H 'Content-Type: application/json' \
            -d '[{"name":"liability","value":false},{"name":"cascoType","value":"full"}]')
          test "$code" = "422"
      # German is not the default, so a German reply proves the query parameter
      # is read and that the bundled fixture carries the translation. A missing
      # one fails at import, which would have killed the container already.
      - name: Answer in the locale the request asks for
        run: |
          body=$(curl -s -X POST 'http://localhost:3000/api/conversation?locale=de' \
            -H 'Content-Type: application/json' \
            -d '[{"name":"liability","value":false},{"name":"casco","value":false},{"name":"licensePlateType","value":"ekz"}]')
          echo "$body" | grep -q 'Benötigen Sie eine Haftpflichtversicherung?'
      - name: Reject a locale the app does not ship
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://localhost:3000/api/conversation?locale=fr' \
            -H 'Content-Type: application/json' \
            -d '[{"name":"liability","value":false}]')
          test "$code" = "422"
      # Exercises the proxy inside the image, which nothing else in this job does.
      - name: Redirect a bare path to a negotiated locale
        run: |
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: de-AT' http://localhost:3000/)
          test "$location" = "http://localhost:3000/de"
      # curl owns Accept-Language, which no browser lets a test do: Chromium
      # ignores an overridden one and WebKit appends the OS locale. So the
      # fallback is asserted here rather than in the e2e suite.
      - name: Fall back to the default locale for an unsupported language
        run: |
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: fr-FR,fr;q=0.9' http://localhost:3000/)
          test "$location" = "http://localhost:3000/en"
      - name: Container logs
        if: failure()
        run: docker logs web
