name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA rather than a tag. A tag is mutable, so
# `@v4` can be repointed at different code without a line here changing. The
# trailing version comment is what Dependabot reads and rewrites on an update.
jobs:
  verify:
    name: Lint, types, unit & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run e2e and accessibility tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # The unit and e2e jobs both run against a dev/next-start server, so neither
  # exercises the standalone bundle the image actually ships. A missing .npmrc in
  # the deps stage passed every other gate and still produced a container that
  # died at start on an unresolvable @swc/helpers, which is what this catches.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t insurance-configurator-demo:ci .
      - name: Start the container
        run: docker run -d --name web -p 3000:3000 insurance-configurator-demo:ci
      - name: Wait for the image's own healthcheck
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' web)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "container never became healthy"
          exit 1
      - name: Accept a complete path
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/conversation \
            -H 'Content-Type: application/json' \
            -d '[{"name":"liability","value":false},{"name":"casco","value":false},{"name":"licensePlateType","value":"ekz"}]')
          test "$code" = "200"
      - name: Reject a path the flow does not allow
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/conversation \
            -H 'Content-Type: application/json' \
            -d '[{"name":"liability","value":false},{"name":"cascoType","value":"full"}]')
          test "$code" = "422"
      - name: Container logs
        if: failure()
        run: docker logs web
