name: Visual regression

# Rendering is environment-specific, so visual snapshots run on demand inside a
# pinned Playwright container rather than in the main CI gate. Regenerate the
# baselines here (append `--update-snapshots`) when an intentional UI change
# lands, then commit the updated PNGs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Visual snapshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run visual regression tests
        run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: playwright-report/
          if-no-files-found: ignore
